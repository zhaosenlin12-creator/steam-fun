        result.then(
          function (res) {
            ////console.log(res);
            callback(res.url);
          }).catch(function (error) {
            //console.log(error);
          });
      } catch (e) {

    //上传文件
    function uploadFile(fileName, fileTag, filePath) {
      var id = null;
      $.ajax({
        url: '/api/system/sysFile/add',
        type: 'POST',
        dataType: 'json',
        contentType: 'application/json',
        async: false,
        beforeSend: function (request) {
          request.setRequestHeader('X-Access-Token', access_token)
        },
        data: JSON.stringify({
          fileType: 2,
          fileName: fileName,
          filePath: filePath,
          fileLocation: 2,
          fileTag: fileTag
        }),
        success: function (res) {
          if (res.success) {
            id = res.result.id
          }
        },
        error: function () { },
        complete: function () { }
      })
      return id;
    }

    //上传作业
    function uploadWork(projectKey, coverKey, projectTitle) {
      $.ajax({
        url: '/api/teaching/teachingWork/submit',
        type: 'POST',
        dataType: 'json',
        contentType: 'application/json',
        beforeSend: function (request) {
          request.setRequestHeader('X-Access-Token', access_token)
        },
        data: JSON.stringify({
          courseId: unitId,
          workCover: coverKey,
          workFile: projectKey,
          workName: projectTitle,
          id: workId,
          workType: 2
        }),
        success: function (res) {

          if (res.code == 200) {
            alert("上传成功")
          } else { }
        },
        error: function () {

        },
        complete: function () { }
      })
    }

  <script>

    new Vue({
      el: '#app',
      data: {
        message: 'Hello Jrcode'
      },
      mounted() {
        // 将vue中的方法赋值给window
        window.goHome = this.goHome;
        window.ToastSuccess = this.ToastSuccess;

        if (typeof publishWorkDisabled !== 'undefined' && publishWorkDisabled) {
          document.body.classList.add('jrcode-publish-banned')
          this.$alert(
            '违规发布不当内容，作品已被封禁，不可再次发布',
            '提示',
            {
              confirmButtonText: '确定',
              type: 'warning',
            }
          )
        }
      },
      methods: {
        goHome() {
          this.$confirm("即将返回,记得保存作品哦！", "提示", {
            confirmButtonText: "确定",
            cancelButtonText: "取消",
            type: "warning",
          }).then(() => {
            // window.history.go(-1);
            window.location.replace(iframeReferer)
            sessionStorage.removeItem('iframeReferer')
          });
        },

        ToastSuccess(msg) {
          this.$message.success({
            message: msg, type: 'success', customClass: 'toast_success', center: true
          });
        }


      }

    })

  </script>
