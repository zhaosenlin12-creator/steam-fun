<head>
  <title>Jrcode</title>
  <script src="../js/oss/aliyun-oss-sdk.min.js"></script>
  <script src="../js/jquery.min.js"></script>
  <script src="../js/jquery.cokie.min.js"></script>

  <link rel="stylesheet" href="../css/toastr.css" />
  <script>
    var access_token = getUserToken();
    var userInfo = UserStuInfo();

    let client;
    var tchPlanId = urlParams('tchPlanId');
    var lessonId = urlParams('lessonId');
    var work_id = urlParams('work_id');

    var uploadParam = {}; //提交参数

    window.scratchJrPage = 'editor';
    window.JrConfig = {
      onSaveCloud: function (contents, name, role, type, cb) {

        //console.log('操作类型');
        //console.log(type);


        if (work_id) {
          uploadParam.id = work_id;
          deleteTchLessonWork(access_token,
            uploadParam,
            function (res) {
              //console.log('删除课堂作品返回');
              //console.log(res);
              if (res.is_delete) {

                window.ToastSuccess('重置成功');
                uploadParam.work_id = null;
                uploadParam.id = null;
                cb('success');
              }
            });
        }
        else {
          window.ToastSuccess('项目还未保存');
          cb('success');
        }




      },

      onSaveLocal: function (contents, name, role, type, cb) {

        //console.log('操作类型');
        //console.log(type);

        InitOss(access_token, function (res) {
          ////console.log("初始化OSS");
          ////console.log(res);
          client = new OSS({
            region: "oss-cn-zhangjiakou",
            accessKeyId: res.AccessKeyId,
            accessKeySecret: res.AccessKeySecret,
            stsToken: res.SecurityToken,
            bucket: "jrcodework",
            secure: true
          });

          uploadParam.title = name; //作品名称

          if (tchPlanId) {
            uploadParam.type = '1';
            uploadParam.tchPlanId = tchPlanId; //讲次id
          }
          else {
            uploadParam.type = '2';
          }

          uploadParam.lessonId = lessonId;
          uploadParam.work_id = work_id;

          var arg = new Array()
          arg[0] = 'works/jrcode/coursetemplate/' + userInfo
            .educational_institution_id;
          arg[1] = userInfo.code;
          arg[2] = Date.parse(new Date()).toString(); //时间戳作为作品名字

          window.ScratchJr.getProjectCover(cover => {
            //TODO 获取到作品截图
            ////console.log("cover")
            ////console.log(cover)
            arg[3] = cover;
            uploadpng(arg, function (pngurl) {
              ////console.log(pngurl);
              uploadParam.covers_url = pngurl; //作品封面图地址

              arg[4] = contents;

              uploadsjr(arg, function (
                sjrurl) {
                //////console.log("项目链接");
                ////console.log(sjrurl);
                uploadParam.work_url =
                  sjrurl; //项目sb3地址
                upload_flag =
                  true; //上传完毕

                //console.log('上传参数');
                //console.log(uploadParam);

                saveTchLessonWork(access_token,
                  uploadParam,
                  function (res) {

                    //console.log('老师保存课堂作品');
                    //console.log(res);
                    if (res.success) {
                      uploadParam.work_id = res.work_id;
                      window.ToastSuccess('保存成功');
                      history.replaceState(null, document.title, location.href.split("?")[0] + '?mode=edit&filepath=' + sjrurl + '&lessonId=' + lessonId + '&work_id=' + work_id + '&tchPlanId=' + tchPlanId + '&role=teach&type=2');
                      cb('success');
                    }
                    else {
                      window.ToastWarning("保存失败");
                      cb('success');
                    }



                  })
              });

            });
          })
        });
      },
      goHome: function () {
        //console.log("返回上一个页面");
        window.goHome();
      }
    }


    function uploadpng(arg, callback) {
      //console.log("上传项目缩略图");
      //console.log(arg);
      var url = arg[0] + '/' + arg[1] + '/' + 'cover/' + arg[2] + '.png';
      //console.log(url);
      try {
        let result = client.put(url, dataURLtoBlob(arg[3]));
        result.then(
          function (res) {
            //console.log(res);
            callback(res.url);
          }).catch(function (error) {
            //console.log(error);
          });
      } catch (e) {
        //console.log(e);
      }
    }

    //更新缩略图
    function updatepng(url, cover, callback) {
      //console.log("更新缩略图");
      //console.log(url);
      try {
        let result = client.put(url, dataURLtoBlob(cover));
        result.then(
          function (res) {
            //console.log(res);
            callback(res.url);
          }).catch(function (error) {
            //console.log(error);
          });
      } catch (e) {
        //console.log(e);
      }
    }

    //上传sjr到OSS
    function uploadsjr(arg, callback) {
      //console.log("上传项目SJR");
      //console.log(arg);
      var url = arg[0] + '/' + arg[1] + '/' + 'release/' + arg[2] + '.sjr';
      //console.log(url);
      try {
        let result = client.put(url, arg[4]);
        result.then(
          function (res) {
            //console.log(res);
            callback(res.url);
          }).catch(function (error) {
            //console.log(error);
          });
      } catch (e) {
        //console.log(e);
      }
    }


    //更新sjr
    function updatesjr(url, file, callback) {
      //console.log("更新SJR");
      //console.log(url);

      try {
        let result = client.put(url, file);
        result.then(
          function (res) {
            //console.log(res);
            callback(res.url);
          }).catch(function (error) {
            //console.log(error);
          });
      } catch (e) {
        //console.log(e);
      }
    }


    //上传文件
    function uploadFile(fileName, fileTag, filePath) {
      var id = null;
      $.ajax({
        url: '/api/system/sysFile/add',
        type: 'POST',
        dataType: 'json',
        contentType: 'application/json',
        async: false,
        beforeSend: function (request) {
          request.setRequestHeader('X-Access-Token', access_token)
        },
        data: JSON.stringify({
          fileType: 2,
          fileName: fileName,
          filePath: filePath,
          fileLocation: 2,
          fileTag: fileTag
        }),
        success: function (res) {
          if (res.success) {
            id = res.result.id
          }
        },
        error: function () { },
        complete: function () { }
      })
      return id;
    }

    //上传作业
    function uploadWork(projectKey, coverKey, projectTitle) {
      $.ajax({
        url: '/api/teaching/teachingWork/submit',
        type: 'POST',
        dataType: 'json',
        contentType: 'application/json',
        beforeSend: function (request) {
          request.setRequestHeader('X-Access-Token', access_token)
        },
        data: JSON.stringify({
          courseId: unitId,
          workCover: coverKey,
          workFile: projectKey,
          workName: projectTitle,
          id: workId,
          workType: 2
        }),
        success: function (res) {
          canShare = true
          if (res.code == 200) {
            alert("上传成功")
          } else { }
        },
        error: function () {

        },
        complete: function () { }
      })
    }

    function upload2Qiniu(zip, key, fileName, observer) {
      var config = {
        useCdnDomain: true,
        region: qiniu.region.z0,
        disableStatisticsReport: true
      }
      var putExtra = {
        fname: fileName, //文件原名
        params: {},
        mimeType: null
      }
      // var observable = qiniu.upload(zip, key, qn_token, putExtra, config)
      var subscription = observable.subscribe(observer)
    }
  </script>

<body style="background: white; overflow: hidden;">


  <div class="frame" id="frame"></div>
  <div class="libframe" id="libframe"></div>
  <div class="paintframe" id="paintframe"></div>
  <!--代码折叠-->
  

  <div id="app">
  </div>

  <script language="Javascript">
    document.oncontextmenu = new Function("event.returnValue=false");
    document.onselectstart = new Function("event.returnValue=false");
  </script>

  <script>

    new Vue({
      el: '#app',
      data: {
        message: 'Hello Jrcode'
      },
      mounted() {
        // 将vue中的方法赋值给window
        window.goHome = this.goHome;
        window.ToastSuccess = this.ToastSuccess;
        window.Notify = this.Notify;
        window.ToastWarning = this.ToastWarning;
      },
      methods: {
        goHome() {
          this.$confirm("确定要重新加载项目吗？请确保项目已保存", "提示", {
            confirmButtonText: "确定",
            cancelButtonText: "取消",
            type: "warning",
          }).then(() => {
            window.location.reload();
          });
        },

        ToastSuccess(msg) {
          this.$message.success({
            message: msg, type: 'success', customClass: 'toast_success', center: true
          });
        },

        ToastWarning(msg) {
          this.$message.warning(msg);
        },

        Notify(msg) {
          this.$notify.info({
            title: '提示消息',
            message: msg
          });
        }


      }

    })


    //检测窗口变化
    var resizeWaiter = false;

    $(window).resize(function () {
      if (!resizeWaiter) {
        resizeWaiter = true;
        setTimeout(function () {
          console.info("resize触发了！");
          resizeWaiter = false;
          window.Notify('窗口大小发生变化,为了更好的适配,请点击左侧Jrcode图标,重新加载项目!');
        }, 3000);
      }
    });


  </script>
  <style>
    .toast_success {
      z-index: 12000 !important;
      background: #f9cf37 !important;
      color: white !important;
    }

    .el-message--success .el-message__content {
      color: white !important;
      font-size: 18px !important;
      font-weight: bold !important;
    }
  </style>


</body>
