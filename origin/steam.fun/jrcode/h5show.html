    // 全屏事件监听相关变量
    var isJrFullscreen = false;
    var fullscreenEventListeners = [];
    var lastFullscreenChangeTime = 0;
    var fullscreenChangeDebounceTime = 300; // 防抖时间300ms

    //console.log("token");
    //console.log(access_token);
    //console.log("用户信息");

    // 初始化全屏事件监听
    function initFullscreenListeners() {
      console.log('初始化JR全屏事件监听器');

      // 确保初始状态为非全屏
      isJrFullscreen = false;

      // 检查当前浏览器全屏状态
      var currentBrowserFullscreen = document.fullscreenElement ||
        document.webkitFullscreenElement ||
        document.mozFullScreenElement ||
        document.msFullscreenElement;

      if (currentBrowserFullscreen) {
        console.log('检测到浏览器已处于全屏状态');
        isJrFullscreen = true;
      }

      // 监听浏览器全屏事件
      document.addEventListener('fullscreenchange', handleFullscreenChange);
      document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
      document.addEventListener('mozfullscreenchange', handleFullscreenChange);
      document.addEventListener('MSFullscreenChange', handleFullscreenChange);

      // 监听ScratchJr全屏状态变化
      if (window.ScratchJr) {
        // 监听ScratchJr的全屏状态
        monitorScratchJrFullscreen();
      } else {
        // 如果ScratchJr还没加载完成，等待加载
        var checkScratchJrInterval = setInterval(function () {
          if (window.ScratchJr) {
            clearInterval(checkScratchJrInterval);
            monitorScratchJrFullscreen();
          }
        }, 100);
      }

      // 监听页面消息事件（用于跨iframe通信）
      window.addEventListener('message', handleMessageEvent);

      console.log('全屏监听器初始化完成，当前状态:', isJrFullscreen);
    }

    // 处理全屏状态变化（带防抖）
    function handleFullscreenChange(event) {
      var currentTime = Date.now();
      if (currentTime - lastFullscreenChangeTime < fullscreenChangeDebounceTime) {
        console.log('防抖：忽略过于频繁的全屏状态变化');
        return;
      }

      var isFullscreen = document.fullscreenElement ||
        document.webkitFullscreenElement ||
        document.mozFullScreenElement ||
        document.msFullscreenElement;

      if (isFullscreen !== isJrFullscreen) {
        lastFullscreenChangeTime = currentTime;
        console.log('浏览器全屏状态变化:', isFullscreen ? '进入全屏' : '退出全屏');
        isJrFullscreen = isFullscreen;

        // 触发自定义事件
        triggerFullscreenEvent(isFullscreen);

        // 显示通知
        showFullscreenNotification(isFullscreen ? 'JR作品已进入全屏模式' : 'JR作品已退出全屏模式');
      }
    }

    // 监听ScratchJr全屏状态
    function monitorScratchJrFullscreen() {
      if (!window.ScratchJr) return;

      console.log('开始监听ScratchJr全屏状态');

      // 检查ScratchJr当前全屏状态
      if (window.ScratchJr.inFullscreen !== undefined) {
        var currentScratchJrFullscreen = window.ScratchJr.inFullscreen;
        if (currentScratchJrFullscreen !== isJrFullscreen) {
          console.log('ScratchJr当前全屏状态:', currentScratchJrFullscreen);
          isJrFullscreen = currentScratchJrFullscreen;
        }
      }

      // 方法1: 监听ScratchJr的inFullscreen属性
      var originalInFullscreen = window.ScratchJr.inFullscreen;
      Object.defineProperty(window.ScratchJr, 'inFullscreen', {
        get: function () {
          return originalInFullscreen;
        },
        set: function (value) {
          if (value !== originalInFullscreen) {
            var currentTime = Date.now();
            if (currentTime - lastFullscreenChangeTime < fullscreenChangeDebounceTime) {
              console.log('防抖：忽略ScratchJr过于频繁的全屏状态变化');
              return;
            }

            console.log('ScratchJr全屏状态变化:', value ? '进入全屏' : '退出全屏');
            lastFullscreenChangeTime = currentTime;
            originalInFullscreen = value;
            isJrFullscreen = value;
            triggerFullscreenEvent(value);
            showFullscreenNotification(value ? 'JR作品已进入全屏模式' : 'JR作品已退出全屏模式');
          }
        }
      });

      // 方法2: 重写ScratchJr的全屏方法
      if (window.ScratchJr.enterFullScreen) {
        var originalEnterFullScreen = window.ScratchJr.enterFullScreen;
        window.ScratchJr.enterFullScreen = function (event) {
          var currentTime = Date.now();
          if (currentTime - lastFullscreenChangeTime < fullscreenChangeDebounceTime) {
            console.log('防抖：忽略过于频繁的进入全屏操作');
            return originalEnterFullScreen.call(this, event);
          }

          console.log('ScratchJr进入全屏');
          lastFullscreenChangeTime = currentTime;
          isJrFullscreen = true;
          triggerFullscreenEvent(true);
          showFullscreenNotification('JR作品已进入全屏模式');
          return originalEnterFullScreen.call(this, event);
        };
      }

      if (window.ScratchJr.quitFullScreen) {
        var originalQuitFullScreen = window.ScratchJr.quitFullScreen;
        window.ScratchJr.quitFullScreen = function (event) {
          var currentTime = Date.now();
          if (currentTime - lastFullscreenChangeTime < fullscreenChangeDebounceTime) {
            console.log('防抖：忽略过于频繁的退出全屏操作');
            return originalQuitFullScreen.call(this, event);
          }

          console.log('ScratchJr退出全屏');
          lastFullscreenChangeTime = currentTime;
          isJrFullscreen = false;
          triggerFullscreenEvent(false);
          showFullscreenNotification('JR作品已退出全屏模式');
          return originalQuitFullScreen.call(this, event);
        };
      }

      // 方法3: 监听DOM变化，检测全屏按钮状态（改进版）
      var domObserver = null;
      var lastDomFullscreenState = false;

      function setupDOMObserver() {
        if (domObserver) {
          domObserver.disconnect();
        }

        domObserver = new MutationObserver(function (mutations) {
          var fullButton = document.getElementById('full');
          if (!fullButton) return;

          var isFullscreenClass = fullButton.className.includes('fullscreen');

          // 只有当DOM状态真正发生变化时才处理
          if (isFullscreenClass !== lastDomFullscreenState) {
            var currentTime = Date.now();
            if (currentTime - lastFullscreenChangeTime < fullscreenChangeDebounceTime) {
              console.log('防抖：忽略DOM过于频繁的全屏状态变化');
              return;
            }

            // 验证状态变化是否合理
            var browserFullscreen = document.fullscreenElement ||
              document.webkitFullscreenElement ||
              document.mozFullScreenElement ||
              document.msFullscreenElement;

            // 只有当DOM状态与浏览器状态一致时才触发事件
            if (isFullscreenClass === !!browserFullscreen) {
              console.log('通过DOM变化检测到全屏状态变化:', isFullscreenClass ? '进入全屏' : '退出全屏');
              lastFullscreenChangeTime = currentTime;
              lastDomFullscreenState = isFullscreenClass;
              isJrFullscreen = isFullscreenClass;
              triggerFullscreenEvent(isFullscreenClass);
              showFullscreenNotification(isFullscreenClass ? 'JR作品已进入全屏模式' : 'JR作品已退出全屏模式');
            } else {
              console.log('DOM状态与浏览器状态不一致，忽略DOM变化');
            }
          }
        });

        // 开始观察DOM变化
        domObserver.observe(document.body, {
          attributes: true,
          subtree: true,
          attributeFilter: ['class']
        });

        // 初始化DOM状态
        var fullButton = document.getElementById('full');
        if (fullButton) {
          lastDomFullscreenState = fullButton.className.includes('fullscreen');
        }
      }

      // 延迟设置DOM观察器，确保DOM已加载
      setTimeout(setupDOMObserver, 500);

      console.log('ScratchJr全屏监听设置完成，当前状态:', isJrFullscreen);
    }

    // 处理消息事件
    function handleMessageEvent(event) {
      if (event.data && event.data.type === 'fullscreen') {
        console.log('收到全屏消息:', event.data);
        isJrFullscreen = event.data.isFullscreen;
        triggerFullscreenEvent(event.data.isFullscreen);
        showFullscreenNotification(event.data.isFullscreen ? 'JR作品已进入全屏模式' : 'JR作品已退出全屏模式');
      }
    }

    // 触发自定义全屏事件
    function triggerFullscreenEvent(isFullscreen) {
      var event = new CustomEvent('jrFullscreenChange', {
        detail: {
          isFullscreen: isFullscreen,
          timestamp: Date.now()
        }
      });
      document.dispatchEvent(event);

      // 调用注册的监听器
      fullscreenEventListeners.forEach(function (listener) {
        try {
          listener(isFullscreen);
        } catch (error) {
          console.error('全屏事件监听器执行错误:', error);
        }
      });
    }

    // 显示全屏通知
    function showFullscreenNotification(message) {
      // if (typeof toastr !== 'undefined') {
      //   toastr.info(message, '全屏状态', {
      //     timeOut: 2000,
      //     positionClass: 'toast-top-center'
      //   });
      // } else {
      //   console.log('全屏通知:', message);
      // }
    }

    // 添加全屏事件监听器
    function addFullscreenListener(callback) {
      if (typeof callback === 'function') {
        fullscreenEventListeners.push(callback);
      }
    }

    // 移除全屏事件监听器
    function removeFullscreenListener(callback) {
      var index = fullscreenEventListeners.indexOf(callback);
      if (index > -1) {
        fullscreenEventListeners.splice(index, 1);
      }
    }

    // 获取当前全屏状态
    function getFullscreenState() {
      return isJrFullscreen;
    }

    // 检查并同步当前全屏状态
    function checkAndSyncFullscreenState() {
      // 检查浏览器全屏状态
      var browserFullscreen = document.fullscreenElement ||
        document.webkitFullscreenElement ||
        document.mozFullScreenElement ||
        document.msFullscreenElement;

      // 检查ScratchJr全屏状态
      var scratchJrFullscreen = false;
      if (window.ScratchJr && window.ScratchJr.inFullscreen !== undefined) {
        scratchJrFullscreen = window.ScratchJr.inFullscreen;
      }

      // 检查DOM全屏按钮状态
      var domFullscreen = false;
      var fullButton = document.getElementById('full');
      if (fullButton) {
        domFullscreen = fullButton.className.includes('fullscreen');
      }

      // 综合判断全屏状态（优先使用浏览器状态）
      var newFullscreenState = browserFullscreen || (scratchJrFullscreen && domFullscreen);

      console.log('全屏状态检查:', {
        browser: browserFullscreen,
        scratchJr: scratchJrFullscreen,
        dom: domFullscreen,
        current: isJrFullscreen,
        new: newFullscreenState
      });

      if (newFullscreenState !== isJrFullscreen) {
        var currentTime = Date.now();
        if (currentTime - lastFullscreenChangeTime < fullscreenChangeDebounceTime) {
          console.log('防抖：状态检查中忽略过于频繁的变化');
          return isJrFullscreen;
        }

        console.log('全屏状态需要同步:', isJrFullscreen, '->', newFullscreenState);
        lastFullscreenChangeTime = currentTime;
        isJrFullscreen = newFullscreenState;
        triggerFullscreenEvent(newFullscreenState);
      }

      return newFullscreenState;
    }
