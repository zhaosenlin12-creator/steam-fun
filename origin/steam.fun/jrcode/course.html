<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:xlink="http://www.w3.org/1999/xlink">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes">
<meta http-equiv="cache-control" content="no-cache">
<meta charset="utf-8">
<!--引入 element-ui 的样式，-->
<link rel="stylesheet" href="../css/element-ui/lib/theme-chalk/index.css">
<!-- 必须先引入vue，  后使用element-ui -->
<script src="../js/vue/vue.min.js"></script>
<!-- 引入element 的组件库-->
<script src="../css/element-ui/lib/index.js"></script>

<head>
  <title>Jrcode</title>
  <script src="../js/oss/aliyun-oss-sdk.min.js"></script>
  <script src="../js/jquery.min.js"></script>
  <script src="../js/jquery.cokie.min.js"></script>
  <script src="../js/common.js"></script>
  <link rel="stylesheet" href="../css/toastr.css" />
  <script>
    let iframeReferer = sessionStorage.getItem('iframeReferer')
    if (!iframeReferer) {
      sessionStorage.setItem('iframeReferer', iframeReferer = document.referrer)
    }
    var access_token = getUserToken();
    var userInfo = UserStuInfo();

    let client;
    var work_id = urlParams('work_id');
    var work_type = urlParams('work_type');
    var subject_code = urlParams('subject_code');
    var operate = urlParams('operate');
    var workinfo;
    var uploadParam = {}; //提交参数
    var tags = [false, false, false, false, false, false, false, false]; //标签

    //获得讲次信息
    var plan_id = urlParams('plan_id');
    var work_id = urlParams('work_id');
    var operate = urlParams('operate');
    var plan_info;
    var upload_flag = false;

    var exist_homework = false;
    var exist_coursework = false;
    /*
        console.log("操作参数");
        console.log("plan_id:" + plan_id);
        console.log("work_id:" + work_id);
        console.log("operate:" + operate);
        console.log(userInfo);
        */
    uploadParam.stu_user_id = userInfo.id;


    if (operate == '1' || operate == '2') {
      //console.log("学员讲次信息-课堂模板");
      getPlanInfo(access_token, plan_id, '1', function (info) {
        //console.log("学生讲次信息-课堂模板");
        //console.log(info);
        plan_info = info;
        if (plan_info.scTchWorkInfo) {
          exist_coursework = true;
        }

      })
    } else if (operate == '3' || operate == '4') {
      //console.log("学员讲次信息-作业模板");
      getPlanInfo(access_token, plan_id, '2', function (info) {
        //console.log("学生讲次信息-作业模板");
        //console.log(info);
        plan_info = info;
        if (plan_info.scTchWorkInfo) {
          exist_homework = true;
        }
      })
    }


    window.scratchJrPage = 'editor';
    window.JrConfig = {
      onSaveCloud: function (contents, name, role, type, cb) {
        console.log('类型');
        console.log(role);
        console.log(type);
        InitOss(access_token, function (res) {
          //console.log("初始化OSS");
          //console.log(res);
          client = new OSS({
            region: "oss-cn-zhangjiakou",
            accessKeyId: res.AccessKeyId,
            accessKeySecret: res.AccessKeySecret,
            stsToken: res.SecurityToken,
            bucket: "jrcodework",
            secure: true
          });

          //console.log("提交课堂作品JR");

          uploadParam.title = name; //作品名称
          uploadParam.stu_tch_plan_id = plan_id; //讲次id
          uploadParam.is_local = false; //是否暂存


          if (operate == '1' || operate == '2') {
            uploadParam.work_type = '1'; //课堂作品
          } else {
            uploadParam.work_type = '2'; //课堂作品
          }



          var arg = new Array()
          arg[0] = 'works/jrcode/coursework/' + userInfo
            .educational_institution_id;
          arg[1] = userInfo.code;
          arg[2] = Date.parse(new Date()).toString(); //时间戳作为作品名字
          /*
                    console.log("发布参数");
                    console.log(uploadParam);
                    console.log(userInfo);
                    console.log("content:" + contents);
          */

          window.ScratchJr.getProjectCover(cover => {
            //TODO 获取到作品截图
            //console.log("cover")
            //console.log(cover)
            arg[3] = cover;
            uploadpng(arg, function (pngurl) {
              //console.log(pngurl);
              uploadParam.covers = pngurl; //作品封面图地址

              arg[4] = contents;

              uploadsjr(arg, function (
                sjrurl) {
                ////console.log("项目链接");
                //console.log(sjrurl);
                uploadParam.work_url =
                  sjrurl; //项目sb3地址
                upload_flag =
                  true; //上传完毕
                UploadJrWorks(access_token,
                  uploadParam,
                  function (res) {
                    if (res.is_create || res.is_save) {
                      //console.log("作品发布成功");
                      //console.log(res);
                      window.ToastSuccess('提交成功');
                      cb('success');
                    } else if (res.is_update) {
                      window.ToastSuccess('提交更新成功');
                      cb('success');
                    } else {
                      alert("提交失败");
                    }
                  })
              });

            });
          })
        })

      },

      onSaveLocal: function (contents, name, role, type, cb) {
        console.log('类型');
        console.log(role);
        console.log(type);

        InitOss(access_token, function (res) {
          //console.log("初始化OSS");
          //console.log(res);
          client = new OSS({
            region: "oss-cn-zhangjiakou",
            accessKeyId: res.AccessKeyId,
            accessKeySecret: res.AccessKeySecret,
            stsToken: res.SecurityToken,
            bucket: "jrcodework",
            secure: true
          });


          //console.log("提交课堂作品JR");

          uploadParam.title = name; //作品名称
          uploadParam.stu_tch_plan_id = plan_id; //讲次id
          uploadParam.is_local = false; //是否暂存


          if (operate == '1' || operate == '2') {
            uploadParam.work_type = '1'; //课堂作品
          } else {
            uploadParam.work_type = '2'; //课堂作品
          }


          var arg = new Array()
          arg[0] = 'works/jrcode/coursework/' + userInfo
            .educational_institution_id;
          arg[1] = userInfo.code;
          arg[2] = Date.parse(new Date()).toString(); //时间戳作为作品名字
          /*
                    console.log("发布参数");
                    console.log(uploadParam);
                    console.log(userInfo);
                    console.log("content:" + contents);
          */

          window.ScratchJr.getProjectCover(cover => {
            //TODO 获取到作品截图
            //console.log("cover")
            //console.log(cover)
            arg[3] = cover;
            uploadpng(arg, function (pngurl) {
              //console.log(pngurl);
              uploadParam.covers = pngurl; //作品封面图地址

              arg[4] = contents;

              uploadsjr(arg, function (
                sjrurl) {
                ////console.log("项目链接");
                //console.log(sjrurl);
                uploadParam.work_url =
                  sjrurl; //项目sb3地址
                upload_flag =
                  true; //上传完毕
                UploadJrWorks(access_token,
                  uploadParam,
                  function (res) {
                    if (res.is_create || res.is_save) {
                      //console.log("作品发布成功");
                      //console.log(res);
                      /*
                       toastr.success('保存成功', '成功', {
                         timeOut: 1000
                       });*/

                      window.ToastSuccess('保存成功');
                      cb('success');

                    } else if (res.is_update) {
                      /*
                      toastr.success('保存更新成功', '成功', {
                        timeOut: 1000
                      });*/

                      window.ToastSuccess('保存更新成功');
                      cb('success');

                    } else {
                      alert("保存失败");
                    }
                  })
              });

            });
          })
        });
      },

      goHome: function () {
        //console.log("返回上一个页面");
        window.goHome();
      }

    }


    function uploadpng(arg, callback) {
      //console.log("上传项目缩略图");
      //console.log(arg);
      var url = arg[0] + '/' + arg[1] + '/' + 'cover/' + arg[2] + '.png';
      //console.log(url);
      try {
        let result = client.put(url, dataURLtoBlob(arg[3]));
        result.then(
          function (res) {
            //console.log(res);
            callback(res.url);
          }).catch(function (error) {
            //console.log(error);
          });
      } catch (e) {
        console.log(e);
      }
    }

    //更新缩略图
    function updatepng(url, cover, callback) {
      //console.log("更新缩略图");
      //console.log(url);
      try {
        let result = client.put(url, dataURLtoBlob(cover));
        result.then(
          function (res) {
            //console.log(res);
            callback(res.url);
          }).catch(function (error) {
            console.log(error);
          });
      } catch (e) {
        console.log(e);
      }
    }

    //上传sjr到OSS
    function uploadsjr(arg, callback) {
      //console.log("上传项目SJR");
      //console.log(arg);
      var url = arg[0] + '/' + arg[1] + '/' + 'release/' + arg[2] + '.sjr';
      //console.log(url);
      try {
        let result = client.put(url, arg[4]);
        result.then(
          function (res) {
            //console.log(res);
            callback(res.url);
          }).catch(function (error) {
            console.log(error);
          });
      } catch (e) {
        console.log(e);
      }
    }


    //更新sjr
    function updatesjr(url, file, callback) {
      //console.log("更新SJR");
      //console.log(url);

      try {
        let result = client.put(url, file);
        result.then(
          function (res) {
            //console.log(res);
            callback(res.url);
          }).catch(function (error) {
            console.log(error);
          });
      } catch (e) {
        console.log(e);
      }
    }


  </script>
  <script type="text/javascript" src="app.bundle.js"></script>
  <script src="../js/toastr.js"></script>


</head>

<body style="background: white; overflow: hidden;">

  <div class="frame" id="frame"></div>
  <div class="libframe" id="libframe"></div>
  <div class="paintframe" id="paintframe"></div>
  <!--代码折叠-->
  


  <div id="app">
  </div>

  <script language="Javascript">
    document.oncontextmenu = new Function("event.returnValue=false");
    document.onselectstart = new Function("event.returnValue=false");
  </script>

  <script>

    new Vue({
      el: '#app',
      data: {
        message: 'Hello Jrcode'
      },
      mounted() {
        // 将vue中的方法赋值给window
        window.goHome = this.goHome;
        window.ToastSuccess = this.ToastSuccess;
      },
      methods: {
        goHome() {
          this.$confirm("即将返回,记得保存作品哦！", "提示", {
            confirmButtonText: "确定",
            cancelButtonText: "取消",
            type: "warning",
          }).then(() => {
            // window.history.go(-1);
            window.location.replace(iframeReferer)
            sessionStorage.removeItem('iframeReferer')
          });
        },

        ToastSuccess(msg) {
          this.$message.success({
            message: msg, type: 'success', customClass: 'toast_success', center: true
          });
        }
      }

    })

  </script>
  <style>
    .toast_success {
      z-index: 12000 !important;
      background: #f9cf37 !important;
      color: white !important;
    }

    .el-message--success .el-message__content {
      color: white !important;
      font-size: 18px !important;
      font-weight: bold !important;
    }
  </style>

</body>

</html>
