      beforeSend: function (request) {

          region: "oss-cn-zhangjiakou",
          accessKeyId: res.AccessKeyId,

    var observer = {
      next(res) { },
      error(err) {

        //console.log(res)

          uploadParam.coverKey = uploadFile(res.key, '学生作业-封面', res.key)
        } else {

        }
        if (uploadParam.projectKey && uploadParam.coverKey) {
          uploadWork(uploadParam.projectKey, uploadParam.coverKey, uploadParam.projectTitle)
        }

        uploadParam.work_type = '2'; //1保存项目 2发布项目

                    uploadParam,

                          timeOut: 1000

                        //console.log(res);

                })

      },

      onSaveLocal: function (contents, name) {

        //console.log("保存本地");
        //console.log(name);

                PublishJrWorks(access_token,
                  uploadParam,

                    if (res.is_create) {
                      //console.log("作品保存成功");
                      //console.log(res);

                      toastr.success('作品保存成功', '成功', {
                        timeOut: 1000
                      });

                      uploadParam.work_id = res.work_id;

                    } else {

                    }

            });

        }
      },
      goHome: function () {
        //console.log("返回上一个页面");

    function uploadpng(arg, callback) {
      //console.log("上传项目缩略图");
      //console.log(arg);
      var url = arg[0] + '/' + arg[1] + '/' + 'cover/' + arg[2] + '.png';
      //console.log(url);
      try {
        let result = client.put(url, dataURLtoBlob(arg[3]));
        result.then(
          function (res) {
            //console.log(res);
            callback(res.url);
          }).catch(function (error) {
            //console.log(error);
          });
      } catch (e) {
        //console.log(e);
      }
    }

    //更新缩略图
    function updatepng(url, cover, callback) {
      //console.log("更新缩略图");
      //console.log(url);
      try {
        let result = client.put(url, dataURLtoBlob(cover));
        result.then(
          function (res) {
            //console.log(res);
            callback(res.url);
          }).catch(function (error) {
            //console.log(error);
          });
      } catch (e) {
        //console.log(e);
      }
    }

    //上传sjr到OSS
    function uploadsjr(arg, callback) {
      //console.log("上传项目SJR");
      //console.log(arg);
      var url = arg[0] + '/' + arg[1] + '/' + 'release/' + arg[2] + '.sjr';
      //console.log(url);
      try {
        let result = client.put(url, arg[4]);
        result.then(
          function (res) {
            //console.log(res);
            callback(res.url);
          }).catch(function (error) {
            //console.log(error);
          });
      } catch (e) {
        //console.log(e);
      }
    }


    //更新sjr
    function updatesjr(url, file, callback) {
      //console.log("更新SJR");
      //console.log(url);

      try {
        let result = client.put(url, file);
        result.then(
          function (res) {
            //console.log(res);
            callback(res.url);
          }).catch(function (error) {
            //console.log(error);
          });
      } catch (e) {
        //console.log(e);
      }
    }


    //上传文件
    function uploadFile(fileName, fileTag, filePath) {
      var id = null;
      $.ajax({
        url: '/api/system/sysFile/add',
        type: 'POST',
        dataType: 'json',
        contentType: 'application/json',
        async: false,
        beforeSend: function (request) {
          request.setRequestHeader('X-Access-Token', access_token)
        },
        data: JSON.stringify({
          fileType: 2,
          fileName: fileName,
          filePath: filePath,
          fileLocation: 2,
          fileTag: fileTag
        }),
        success: function (res) {
          if (res.success) {
            id = res.result.id
          }
        },
        error: function () { },
        complete: function () { }
      })
      return id;
    }

    //上传作业
    function uploadWork(projectKey, coverKey, projectTitle) {
      $.ajax({
        url: '/api/teaching/teachingWork/submit',
        type: 'POST',
        dataType: 'json',
        contentType: 'application/json',
        beforeSend: function (request) {
          request.setRequestHeader('X-Access-Token', access_token)
        },
        data: JSON.stringify({
          courseId: unitId,
          workCover: coverKey,
          workFile: projectKey,
          workName: projectTitle,
          id: workId,
          workType: 2
        }),
        success: function (res) {
          canShare = true
          if (res.code == 200) {
            alert("上传成功")
          } else { }
        },
        error: function () {

        },
        complete: function () { }
      })
    }

    function upload2Qiniu(zip, key, fileName, observer) {
      var config = {
        useCdnDomain: true,
        region: qiniu.region.z0,

      }
      var putExtra = {
        fname: fileName, //文件原名
        params: {},
        mimeType: null
      }
      // var observable = qiniu.upload(zip, key, qn_token, putExtra, config)
      var subscription = observable.subscribe(observer)
    }

<script>
  $('.zanwork').on('click', function (e) {

    if (!zanState) {
      operate_state = '1';
    } else {
      operate_state = '2';
    }

    updateJrWorkZanList(access_token, work_id, operate_state, function (res) {
      //console.log("JR作品点赞");
      //console.log(res);

      if (res.is_update) {
        toastr.success('点赞成功', '成功', {
          timeOut: 1000
        });
      } else if (res.is_delete) {
        toastr.success('取消点赞', '成功', {
          timeOut: 1000
        });
      }

      //检测点赞状态
      getJrWorkContent(access_token, work_id, function (res) {
        //console.log('作品点赞状态');
        //console.log(res);
        zanState = res.jrWork.zanState;
        keepState = res.jrWork.keepState;
      })



    })

  })

  $('.keepwork').on('click', function (e) {

    //console.log("收藏");


    if (!keepState) {
      operate_state_keep = '1';
    } else {
      operate_state_keep = '2';
    }

    updateJrWorkKeepList(access_token, work_id, operate_state_keep, function (res) {
      //console.log("JR作品收藏");
      //console.log(res);

      if (res.is_update) {
        toastr.success('收藏成功', '成功', {

        });
      } else if (res.is_delete) {

        });
      }

      //检测点赞状态

        //console.log('作品收藏状态');
        //console.log(res);
        zanState = res.jrWork.zanState;
        keepState = res.jrWork.keepState;
      })



    })

  })
</script>
