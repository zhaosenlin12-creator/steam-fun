    function uploadpng(arg, callback) {
      //console.log("上传项目缩略图");
      //console.log(arg);
      var url = arg[0] + "/" + arg[1] + "/" + "cover/" + arg[2] + ".png";
      //console.log(url);
      try {
        let result = client.put(url, dataURLtoBlob(arg[3]));
        result
          .then(function (res) {
            //console.log(res);
            callback(res.url);
          })
          .catch(function (error) {
            //console.log(error);
          });
      } catch (e) {
        //console.log(e);
      }
    }

    //64位数据转Blob类型
    function dataURLtoBlob(dataurl) {
      var arr = dataurl.split(",");
      //注意base64的最后面中括号和引号是不转译的
      var _arr = arr[1].substring(0, arr[1].length - 2);
      var mime = arr[0].match(/:(.*?);/)[1],
        bstr = atob(_arr),
        n = bstr.length,
        u8arr = new Uint8Array(n);
      while (n--) {
        u8arr[n] = bstr.charCodeAt(n);
      }
      return new Blob([u8arr], {
        type: mime,
      });
    }

  <script>
    new Vue({
      el: "#app",
      data: {
        message: "Hello Scratch",
      },
      mounted() {
        // 将vue中的方法赋值给window
        window.goClass = this.goClass;
        window.Loading = this.Loading;
        window.ToastSuccess = this.ToastSuccess;
        window.ToastWarning = this.ToastWarning;
        // worktype=4：进入页即提示不可发布（与 publishWorkDisabled 一致）
        if (typeof publishWorkDisabled !== 'undefined' && publishWorkDisabled) {
          this.$alert(
            '违规发布不当内容，作品已被封禁，不可再次发布',
            '提示',
            {
              confirmButtonText: '确定',
              type: 'warning',
            }
          );
        }
      },
      methods: {
        goClass() {
          console.log('history.length:', history.length)
          console.log('originHistoryLength:', originHistoryLength)
          console.log('history.length > (2 + originHistoryLength):', history.length > (2 + originHistoryLength))
          this.$confirm("即将返回,记得保存作品哦！", "提示", {
            confirmButtonText: "确定",
            cancelButtonText: "取消",
            type: "warning",
          }).then(() => {
            // 取消身份判断，从哪里进来回哪里去，并且历史记录回退对应的步数，确保不影响上级页面的路由前进后退操作
            if (iframeReferer) {
              window.location.replace(iframeReferer)
            }
            sessionStorage.removeItem('iframeReferer')
            if (history.length > (2 + originHistoryLength)) {
              const diffHistoryLength = history.length - (initHistoryLength + 1)
              window.history.go(-(2 + originHistoryLength + diffHistoryLength));
            } else {
              window.history.go(-2);
            }
            sessionStorage.removeItem('originHistoryLength')
          });
        },

        ToastSuccess(msg) {
          this.$message.success({
            message: msg,
            type: "success",
            customClass: "toast_success",
            center: true,
            offset: 100,
          });
        },

        ToastWarning(msg) {
          this.$message.warning(msg);
        },

        Loading(cmd) {
          if (cmd == "1") {
            this.$loading({
              lock: false,
              text: "数据传输中...按ESC退出",
              spinner: "el-icon-loading",
              background: "rgba(237, 241, 253,0.7 )",
            });
          } else if (cmd == "2") {
            this.$loading({
              lock: false,
              text: "",
              spinner: "el-icon-loading",
              background: "rgba(0, 0, 0, 0)",
            }).close();
          }
        },
      },
    });
  </script>
