    function uploadpng(arg, callback) {
      //console.log("上传项目缩略图");
      ////console.log(arg);
      var url = arg[0] + "/" + arg[1] + "/" + "cover/" + arg[2] + ".png";
      ////console.log(url);
      try {
        let result = client.put(url, dataURLtoBlob(arg[3]));
        result
          .then(function (res) {
            ////console.log(res);
            callback(res.url);
          })
          .catch(function (error) {
            //console.log(error);
          });
      } catch (e) {
        //console.log(e);
      }
    }
    //更新缩略图
    function updatepng(url, cover, callback) {
      ////console.log("更新缩略图");
      ////console.log(url);
      try {
        let result = client.put(url, dataURLtoBlob(cover));
        result

    //64位数据转Blob类型
    function dataURLtoBlob(dataurl) {
      var arr = dataurl.split(",");
      //注意base64的最后面中括号和引号是不转译的
      var _arr = arr[1].substring(0, arr[1].length - 2);
      var mime = arr[0].match(/:(.*?);/)[1],
        bstr = atob(_arr),
        n = bstr.length,
        u8arr = new Uint8Array(n);
      while (n--) {
        u8arr[n] = bstr.charCodeAt(n);
      }
      return new Blob([u8arr], {
        type: mime,
      });
    }
