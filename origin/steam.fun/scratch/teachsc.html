        function uploadpng(arg, callback) {
            //console.log("上传项目缩略图");
            //console.log(arg);
            var url = arg[0] + "/" + arg[1] + "/" + "cover/" + arg[2] + ".png";
            //console.log(url);
            try {
                let result = client.put(url, dataURLtoBlob(arg[3]));
                result
                    .then(function (res) {
                        //console.log(res);
                        callback(res.url);
                    })
                    .catch(function (error) {
                        //console.log(error);
                    });
            } catch (e) {
                //console.log(e);
            }
        }
        //上传sb3到OSS

            //console.log(url);
            try {
                let result = client.put(url, arg[4]);
                result
                    .then(function (res) {

    <script type="text/javascript">
        if (window.Event) {
            document.captureEvents(Event.MOUSEUP);
        }
        function nocontextmenu() {
            event.cancelBubble = true;
            event.returnValue = false;
            return false;
        }
        function norightclick(e) {
            if (window.Event) {
                if (e.which == 2 || e.which == 3) return false;
            } else if (event.button == 2 || event.button == 3) {
                event.cancelBubble = true;
                event.returnValue = false;
                return false;
            }
        }
        document.oncontextmenu = nocontextmenu; // for IE5+
        document.onmousedown = norightclick; // for all others
    </script>

    <div id="app"></div>

    <script>
        new Vue({
            el: "#app",
            data: {
                message: "Hello Jrcode",
            },
            mounted() {
                // 将vue中的方法赋值给window
                window.goHome = this.goHome;
                window.Loading = this.Loading;
                window.ToastSuccess = this.ToastSuccess;
                window.ToastWarning = this.ToastWarning;
            },
            methods: {
                goHome() {
                    this.$confirm("即将返回,记得保存作品哦！", "提示", {
                        confirmButtonText: "确定",
                        cancelButtonText: "取消",
                        type: "warning",
                    }).then(() => {
                        //点击确定后操作
                        if (window.userInfo.studentUserInfo) {
                            window.location.href = "/code-classroom/classroom-index-stu";
                        } else {
                            window.location.href = "/code-classroom/classroom-index";
                        }
                    });
                },

                ToastSuccess(msg) {
                    this.$message.success({
                        message: msg,
                        type: "success",
                        customClass: "toast_success",
                        center: true,
                        offset: 100,
                    });
                },

                ToastWarning(msg) {
                    this.$message.warning(msg);
                },

                Loading(cmd) {
                    if (cmd == "1") {
                        this.$loading({
                            lock: false,
                            text: "数据传输中...按ESC退出",
                            spinner: "el-icon-loading",
                            background: "rgba(237, 241, 253,0.7 )",
                        });
                    } else if (cmd == "2") {
                        this.$loading({
                            lock: false,
                            text: "",
                            spinner: "el-icon-loading",
                            background: "rgba(0, 0, 0, 0)",
                        }).close();
                    }
                },
            },
        });
    </script>

    <script>
        //当前页面监视键盘输入
        document.onkeydown = function (e) {
            //事件对象兼容
            //console.log('键盘输入');
            //console.log(e);
            let e1 =
                e || event || window.event || arguments.callee.caller.arguments[0];
            //键盘按键判断:左箭头-37;上箭头-38；右箭头-39;下箭头-40
            //左
            if (e1 && e1.keyCode == 27) {
                //console.log('终止数据传输');
                window.Loading("2");
            }
        };
    </script>
    <style>
        .toast_success {
            z-index: 12000 !important;
            background: #e6f0ff !important;
        }

        .el-message--success .el-message__content {
            color: #4d98ff !important;
        }
    </style>

    <script>
        window.onbeforeunload = function (e) {
            window.onbeforeunload = null;
        };

        function postParentMessage(message) {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({
                    type: 'watchScratchIframe',
                    message: message
                }, '*');
            }
        }
    </script>
</body>

</html>
