<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00BCD4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9800;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF5722;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 图标部分 -->
  <g transform="translate(20, 10)">
    <path d="M15 20 Q 5 40 15 60" stroke="url(#grad1)" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M65 20 Q 75 40 65 60" stroke="url(#grad1)" stroke-width="8" fill="none" stroke-linecap="round"/>
    <circle cx="40" cy="40" r="12" fill="url(#grad2)" />
    <line x1="30" y1="55" x2="50" y2="25" stroke="url(#grad2)" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- 文字部分 -->
  <g transform="translate(90, 65)">
    <text font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-weight="bold" font-size="42">
      <tspan fill="url(#grad1)">乐</tspan><tspan fill="url(#grad2)">启</tspan><tspan fill="url(#grad1)">享</tspan>
    </text>
    <text x="140" y="0" font-family="Arial, sans-serif" font-weight="bold" font-size="24" fill="#00ffff" letter-spacing="2">CODE</text>
    <text x="0" y="25" font-family="Arial, sans-serif" font-size="14" fill="#cccccc" letter-spacing="5">少儿编程教育</text>
  </g>
</svg>
