<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 创造启蒙</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, "Microsoft YaHei", sans-serif; }
    * { box-sizing: border-box; }
    body { align-items: center; background: #081a2b; color: #f4fbff; display: flex; margin: 0; min-height: 100vh; padding: 24px; }
    main { background: #123249; border: 1px solid #2c6079; display: grid; gap: 20px; grid-template-columns: minmax(0, 1.1fr) minmax(240px, .9fr); margin: auto; max-width: 1100px; min-height: 580px; overflow: hidden; width: 100%; }
    .copy { display: flex; flex-direction: column; justify-content: center; padding: clamp(28px, 6vw, 80px); }
    .eyebrow { color: #85e8d3; font-size: 14px; margin: 0 0 18px; }
    h1 { font-size: clamp(34px, 6vw, 68px); line-height: 1.15; margin: 0; }
    h1 em { color: #7de0ff; font-style: normal; }
    p { color: #b9d3df; font-size: clamp(16px, 2vw, 20px); line-height: 1.8; margin: 26px 0 0; }
    .goals { border-top: 1px solid #2c6079; display: grid; gap: 12px; margin-top: 38px; padding-top: 20px; }
    .goals span { color: #d9f7ee; font-size: 15px; }
    figure { margin: 0; min-height: 300px; position: relative; }
    figure::after { background: linear-gradient(180deg, rgba(8, 26, 43, 0) 45%, rgba(8, 26, 43, .75)); content: ""; inset: 0; position: absolute; }
    img { height: 100%; object-fit: cover; position: absolute; width: 100%; }
    .label { bottom: 32px; color: #fff; font-size: 14px; left: 32px; position: absolute; z-index: 1; }
    @media (max-width: 700px) { body { padding: 0; } main { grid-template-columns: 1fr; min-height: 100vh; } figure { min-height: 260px; } }
  </style>
</head>
<body>
  <main>
    <section class="copy">
      <p class="eyebrow" id="eyebrow">AI 创造启蒙 · 第 1 课</p>
      <h1 id="title">让机器人<br><em>感知并行动</em></h1>
      <p id="description">观察、搭建、调试，让每一次尝试都变成下一步创造的依据。</p>
      <div class="goals" id="goals">
        <span>目标 01 · 认识基础机械结构</span>
        <span>目标 02 · 体验顺序控制</span>
        <span>目标 03 · 完成作品展示</span>
      </div>
    </section>
    <figure>
      <img id="cover" src="/_site/courses/images/robot-camp.webp" alt="机器人创作课堂">
      <span class="label">乐启享机器人 · 本地课程示例</span>
    </figure>
  </main>
  <script>
    const mission = new URLSearchParams(location.search).get('lesson') === 'robot-mission';
    if (mission) {
      document.title = '机器人任务';
      document.getElementById('eyebrow').textContent = 'AI 创造启蒙 · 第 2 课';
      document.getElementById('title').innerHTML = '给机器人一个<br><em>协作任务</em>';
      document.getElementById('description').textContent = '在分工与调试中，把机械结构和程序控制变成可以完成的挑战。';
      document.getElementById('goals').innerHTML = '<span>目标 01 · 设计任务流程</span><span>目标 02 · 调整结构与程序</span><span>目标 03 · 协作完成挑战</span>';
      document.getElementById('cover').src = '/_site/courses/images/lego-course.webp';
    }
  </script>
</body>
</html>
