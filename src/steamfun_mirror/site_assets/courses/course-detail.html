<body>
  <!-- Navbar -->
  <nav class="courses-nav">
    <a href="/" class="nav-logo">
      <img src="images/logo11.png" alt="乐启享">
      <div class="nav-logo-text">
        <span class="text-blue">乐创未来</span><br>
        <span class="text-orange">启享编程</span>
      </div>
    </a>
    <button class="menu-toggle" onclick="toggleMenu()">
      <i class="fas fa-bars"></i>
    </button>
    <ul class="nav-links" id="navLinks">
      <li><a href="/">首页</a></li>
      <li><a href="courses.html">课程体系</a></li>
      <li><a href="courses.html#routes">学习路线</a></li>
      <li><a href="courses.html#booking">预约体验</a></li>
      <li><a href="/#signal">联系我们</a></li>

    </ul>
  </nav>

  <!-- Detail Hero (dynamic) -->
  <section class="detail-hero" id="detailHero">
    <div class="breadcrumb">
      <a href="courses.html"><i class="fas fa-arrow-left" style="margin-right:4px"></i>课程体系</a> / <span id="detailTitle">课程名称</span>
    </div>
    <h1 id="detailTitle2"></h1>
    <div class="detail-meta">
      <span><i class="fas fa-user-graduate"></i> <span id="detailAge"></span></span>
    </div>
    <div class="detail-core-goal" id="detailDesc" style="margin-top:16px"></div>
  </section>

  <!-- Tab Navigation (dynamic) -->
  <div class="detail-tabs" id="detailTabs"></div>

  <!-- Tab Content (dynamic) -->
  <div id="detailContent"></div>

  <!-- Bottom CTA -->

      <i class="fas fa-calendar-check"></i> 预约免费体验课
    </a>

  <!-- Footer -->
  <footer class="courses-footer">
    <div class="footer-links-row">
      <a href="/">首页</a>
      <a href="courses.html">课程体系</a>

  </footer>

  <!-- Scripts -->
  <script src="js/course-data.js?v=55f793c7"></script>
  <script src="js/courses.js?v=eaf64648"></script>
  <script>
    /* #15 Fix: iOS Safari 跨页锚链接偏差修复 */
    document.addEventListener('DOMContentLoaded', function() {
      if (location.hash) {
        setTimeout(function() {
          var el = document.querySelector(location.hash);
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 300);
      }
    });
  </script>
  <script>
    // Update page title dynamically
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      if (id && typeof COURSE_DATA !== 'undefined') {
        const stage = COURSE_DATA.stages.find(s => s.id === id);
        if (stage) {
          document.title = `${stage.name} - 乐启享编程教育`;
          const t2 = document.getElementById('detailTitle2');
          if (t2) t2.textContent = stage.name;
        }
      }
    });
  </script>
</body>
</html>
